name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova Project
        run: |
          if [ ! -f "config.xml" ]; then
            cordova create temp_app com.jrcode.app JRCode
            cp -r temp_app/* .
            rm -rf temp_app
          fi
          cordova platform add android --nosave || true

      - name: Install Cordova Plugins (File Picker & Permissions)
        run: |
          cordova plugin add cordova-plugin-file --nosave || true
          cordova plugin add cordova-plugin-android-permissions --nosave || true

      - name: Build Android APK
        run: cordova build android --release -- --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRCode-Release-APK
          path: platforms/android/app/build/outputs/apk/release/*.apk
