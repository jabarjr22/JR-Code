name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Cordova Project & Preserve Web Source
        run: |
          # Backup folder www milik Anda
          mkdir -p my_src
          cp -r www/* my_src/ 2>/dev/null || true
          
          # Buat struktur proyek Cordova jika belum ada config.xml
          if [ ! -f "config.xml" ]; then
            cordova create temp_app com.jrcode.app JRCode
            cp -r temp_app/* .
            rm -rf temp_app
          fi

          # Kembalikan file www asli Anda agar tidak tertimpa template Cordova
          mkdir -p www
          cp -r my_src/* www/
          rm -rf my_src

      - name: Clean Old Platforms & Install Plugins
        run: |
          rm -rf platforms/android
          cordova plugin add cordova-plugin-file --nosave || true
          cordova plugin add cordova-plugin-android-permissions --nosave || true

      - name: Add Android Platform
        run: cordova platform add android@latest

      - name: Build Android APK
        run: cordova build android --debug -- --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRCode-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
