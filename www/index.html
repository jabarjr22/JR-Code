<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Code</title>
    <!-- CodeMirror Editor Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #e6e9ef;
            --shadow-light: #ffffff;
            --shadow-dark: #b8bec9;
            --accent-blue: #0066ff;
            --text-color: #4a5568;
            --danger-color: #ff3b30;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .neu-flat {
            background: var(--bg-color);
            box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
            border-radius: 16px;
        }

        .neu-pressed {
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-radius: 16px;
        }

        .neu-btn {
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            transition: all 0.2s ease;
        }

        .neu-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        /* View Switching System */
        .page-view {
            display: none;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            flex-direction: column;
            gap: 14px;
        }

        .page-view.active-page {
            display: flex;
        }

        /* PAGE 1: App Grid Layout */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-auto-rows: max-content;
            gap: 20px 16px;
            align-content: start;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
        }

        .item-icon-box {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            background: var(--bg-color);
            transition: transform 0.2s ease;
        }

        .grid-item:active .item-icon-box {
            transform: scale(0.92);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .item-title {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
            word-break: break-word;
            max-width: 80px;
            line-height: 1.2;
        }

        .item-options {
            position: absolute;
            top: -4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-color);
        }

        /* PAGE 2: Editor Section */
        .nav-back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            padding: 6px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light);
            color: var(--accent-blue);
        }

        .icon-square {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .icon-html { background: linear-gradient(135deg, #ff5722, #ff9800); }
        .icon-css { background: linear-gradient(135deg, #0066ff, #00d2ff); }
        .icon-js { background: linear-gradient(135deg, #ffc107, #ff9800); }

        .editor-container {
            height: 210px;
            padding: 10px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .editor-wrapper {
            display: none;
            height: 100%;
        }

        .editor-wrapper.active {
            display: block;
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 13px !important;
            line-height: 1.5 !important;
            background-color: transparent !important;
            color: #2d3748 !important;
        }

        .CodeMirror-gutters {
            background-color: transparent !important;
            border-right: 1px solid rgba(0,0,0,0.05) !important;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-radius: 30px;
            flex-shrink: 0;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 800;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
        }

        .status-dot.typing {
            animation: pulse-blink 0.3s infinite alternate;
        }

        @keyframes pulse-blink {
            0% { opacity: 0.2; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .preview-container {
            flex: 1;
            padding: 6px;
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 14px;
            background-color: #ffffff;
        }

        /* Modal Dialog Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            width: 85%;
            max-width: 340px;
            padding: 20px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--bg-color);
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-color);
        }

        .neu-input {
            width: 100%;
            padding: 10px 14px;
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            border-radius: 14px;
            font-size: 13px;
            color: var(--text-color);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <!-- PAGE 1: DAFTAR FILE / APP MENU GRID -->
    <div id="page-list" class="page-view active-page">
        <div class="header-bar neu-flat">
            <div class="app-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                JR Code
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="file" id="file-input" accept="text/html, .html, .htm">
                <button class="neu-btn" onclick="triggerFileInput()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Import
                </button>
                <button class="neu-btn" onclick="openCreateModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Baru
                </button>
            </div>
        </div>

        <!-- App Icon Grid View -->
        <div id="grid-container" class="app-grid-container neu-pressed"></div>
    </div>

    <!-- PAGE 2: EDITOR & LIVE PREVIEW -->
    <div id="page-editor" class="page-view">
        <div class="nav-back-bar neu-flat">
            <button class="neu-btn" onclick="goBackToHome()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                Kembali
            </button>
            <span id="current-project-title" style="font-size: 14px; font-weight: 800; color: var(--text-color);">Project</span>
            <button class="neu-btn" onclick="saveCurrentProject()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Simpan
            </button>
        </div>

        <div class="tabs-header neu-flat">
            <button class="tab-btn active" onclick="switchTab('html')">
                <span class="icon-square icon-html"></span> HTML
            </button>
            <button class="tab-btn" onclick="switchTab('css')">
                <span class="icon-square icon-css"></span> CSS
            </button>
            <button class="tab-btn" onclick="switchTab('js')">
                <span class="icon-square icon-js"></span> JS
            </button>
        </div>

        <div class="editor-container neu-pressed">
            <div id="wrapper-html" class="editor-wrapper active">
                <textarea id="code-html"></textarea>
            </div>
            <div id="wrapper-css" class="editor-wrapper">
                <textarea id="code-css"></textarea>
            </div>
            <div id="wrapper-js" class="editor-wrapper">
                <textarea id="code-js"></textarea>
            </div>
        </div>

        <div class="action-bar neu-flat">
            <div class="live-status">
                LIVE <span id="live-dot" class="status-dot"></span>
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="neu-btn" style="padding: 6px 10px; font-size: 11px;" onclick="downloadSingleFile()">
                    Export HTML
                </button>
                <button class="neu-btn" style="padding: 6px 10px; font-size: 11px;" onclick="resetCode()">
                    Reset
                </button>
            </div>
        </div>

        <div class="preview-container neu-pressed">
            <iframe id="preview-window"></iframe>
        </div>
    </div>

    <!-- MODAL BUAT FILE BARU -->
    <div id="modal-create" class="modal-overlay">
        <div class="modal-card neu-flat">
            <div class="modal-title">Buat Berkas Baru</div>
            <div>
                <label style="font-size: 11px; font-weight: 700; margin-bottom: 4px; display: block;">Nama File:</label>
                <input type="text" id="new-file-name" class="neu-input" placeholder="Contoh: Aplikasi Saya">
            </div>
            <div class="modal-buttons">
                <button class="neu-btn" onclick="closeCreateModal()">Batal</button>
                <button class="neu-btn" style="color: var(--accent-blue);" onclick="confirmCreateProject()">Buat</button>
            </div>
        </div>
    </div>

    <!-- MODAL CUSTOMIZE ICON / NAME -->
    <div id="modal-edit" class="modal-overlay">
        <div class="modal-card neu-flat">
            <div class="modal-title">Edit Menu Icon</div>
            <div>
                <label style="font-size: 11px; font-weight: 700; margin-bottom: 4px; display: block;">Nama File:</label>
                <input type="text" id="edit-name" class="neu-input">
            </div>
            <div>
                <label style="font-size: 11px; font-weight: 700; margin-bottom: 4px; display: block;">Simbol Emoji Icon:</label>
                <input type="text" id="edit-icon" class="neu-input" maxlength="2">
            </div>
            <div class="modal-buttons">
                <button class="neu-btn" style="color: var(--danger-color);" onclick="deleteProjectFromModal()">Hapus</button>
                <button class="neu-btn" onclick="closeModal()">Batal</button>
                <button class="neu-btn" style="color: var(--accent-blue);" onclick="saveModalEdit()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- CodeMirror Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <script>
        let projects = JSON.parse(localStorage.getItem('jrcode_projects')) || [
            {
                id: 'demo-1',
                name: 'Welcome App',
                icon: '🚀',
                html: '<div class="card"><h1>JR Code App</h1><p>Selamat datang di JR Code Editor.</p><button onclick="alert(\'Halo!\')">Klik Saya</button></div>',
                css: 'body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #e0e5ec; margin: 0; }\n.card { background: #e0e5ec; padding: 30px; border-radius: 20px; box-shadow: 8px 8px 16px #b8bec9, -8px -8px 16px #ffffff; text-align: center; }\nbutton { margin-top: 15px; padding: 10px 20px; border: none; border-radius: 12px; background: #0066ff; color: white; font-weight: bold; cursor: pointer; }',
                js: 'console.log("Welcome to JR Code!");'
            }
        ];

        let activeProjectId = null;
        let activeEditId = null;

        const editorHTML = CodeMirror.fromTextArea(document.getElementById('code-html'), { mode: 'htmlmixed', lineNumbers: true });
        const editorCSS = CodeMirror.fromTextArea(document.getElementById('code-css'), { mode: 'css', lineNumbers: true });
        const editorJS = CodeMirror.fromTextArea(document.getElementById('code-js'), { mode: 'javascript', lineNumbers: true });

        let typingTimer;
        const liveDot = document.getElementById('live-dot');

        [editorHTML, editorCSS, editorJS].forEach(editor => {
            editor.on('change', () => {
                triggerBlink();
                updatePreview();
            });
        });

        function triggerBlink() {
            liveDot.classList.add('typing');
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => liveDot.classList.remove('typing'), 600);
        }

        function renderProjectGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            projects.forEach(proj => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerHTML = `
                    <div class="item-options" onclick="openEditModal(event, '${proj.id}')">⚙️</div>
                    <div class="item-icon-box" onclick="openProject('${proj.id}')">${proj.icon || '📄'}</div>
                    <div class="item-title" onclick="openProject('${proj.id}')">${proj.name}</div>
                `;
                container.appendChild(item);
            });
            
            localStorage.setItem('jrcode_projects', JSON.stringify(projects));
        }

        function openProject(id) {
            const proj = projects.find(p => p.id === id);
            if (!proj) return;

            activeProjectId = id;
            document.getElementById('current-project-title').textContent = proj.name;

            editorHTML.setValue(proj.html || '');
            editorCSS.setValue(proj.css || '');
            editorJS.setValue(proj.js || '');

            document.getElementById('page-list').classList.remove('active-page');
            document.getElementById('page-editor').classList.add('active-page');

            switchTab('html');
            updatePreview();
        }

        function goBackToHome() {
            saveCurrentProject();
            document.getElementById('page-editor').classList.remove('active-page');
            document.getElementById('page-list').classList.add('active-page');
            renderProjectGrid();
        }

        function saveCurrentProject() {
            if (!activeProjectId) return;
            const proj = projects.find(p => p.id === activeProjectId);
            if (proj) {
                proj.html = editorHTML.getValue();
                proj.css = editorCSS.getValue();
                proj.js = editorJS.getValue();
                localStorage.setItem('jrcode_projects', JSON.stringify(projects));
            }
        }

        /* Handler Modal Buat Baru (Pengganti Prompt Browser) */
        function openCreateModal() {
            document.getElementById('new-file-name').value = '';
            document.getElementById('modal-create').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('modal-create').style.display = 'none';
        }

        function confirmCreateProject() {
            const nameInput = document.getElementById('new-file-name').value.trim();
            const newName = nameInput !== '' ? nameInput : 'Proyek Baru';

            const newProj = {
                id: 'proj_' + Date.now(),
                name: newName,
                icon: '🌐',
                html: '<h1>' + newName + '</h1>\n<p>Mulai ketik kode di sini...</p>',
                css: 'body { padding: 20px; font-family: sans-serif; }',
                js: ''
            };

            projects.push(newProj);
            closeCreateModal();
            renderProjectGrid();
            openProject(newProj.id);
        }

        /* Handler Import File */
        function triggerFileInput() {
            const fileInput = document.getElementById('file-input');
            fileInput.value = '';
            fileInput.click();
        }

        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');

                let extractedCSS = '';
                doc.querySelectorAll('style').forEach(s => {
                    extractedCSS += s.textContent + '\n';
                    s.remove();
                });

                let extractedJS = '';
                doc.querySelectorAll('script').forEach(s => {
                    if (!s.src) {
                        extractedJS += s.textContent + '\n';
                        s.remove();
                    }
                });

                const importedProj = {
                    id: 'proj_' + Date.now(),
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    icon: '📁',
                    html: doc.body.innerHTML.trim() || content,
                    css: extractedCSS.trim(),
                    js: extractedJS.trim()
                };

                projects.push(importedProj);
                renderProjectGrid();
                openProject(importedProj.id);
            };
            reader.readAsText(file);
        });

        /* Edit Modal Handlers */
        function openEditModal(event, id) {
            event.stopPropagation();
            activeEditId = id;
            const proj = projects.find(p => p.id === id);
            if (!proj) return;

            document.getElementById('edit-name').value = proj.name;
            document.getElementById('edit-icon').value = proj.icon || '📄';
            document.getElementById('modal-edit').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-edit').style.display = 'none';
        }

        function saveModalEdit() {
            const proj = projects.find(p => p.id === activeEditId);
            if (proj) {
                proj.name = document.getElementById('edit-name').value || 'Tanpa Nama';
                proj.icon = document.getElementById('edit-icon').value || '📄';
                renderProjectGrid();
            }
            closeModal();
        }

        function deleteProjectFromModal() {
            if (confirm('Yakin ingin menghapus file ini?')) {
                projects = projects.filter(p => p.id !== activeEditId);
                renderProjectGrid();
                closeModal();
            }
        }

        /* Editor Utilities */
        function updatePreview() {
            const html = editorHTML.getValue();
            const css = editorCSS.getValue();
            const js = editorJS.getValue();

            const fullContent = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;

            const doc = document.getElementById('preview-window').contentWindow.document;
            doc.open();
            doc.write(fullContent);
            doc.close();
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const wrappers = document.querySelectorAll('.editor-wrapper');
            
            tabs.forEach(t => t.classList.remove('active'));
            wrappers.forEach(w => w.classList.remove('active'));

            if(tab === 'html') {
                tabs[0].classList.add('active');
                document.getElementById('wrapper-html').classList.add('active');
                editorHTML.refresh();
            } else if(tab === 'css') {
                tabs[1].classList.add('active');
                document.getElementById('wrapper-css').classList.add('active');
                editorCSS.refresh();
            } else if(tab === 'js') {
                tabs[2].classList.add('active');
                document.getElementById('wrapper-js').classList.add('active');
                editorJS.refresh();
            }
        }

        function resetCode() {
            editorHTML.setValue('');
            editorCSS.setValue('');
            editorJS.setValue('');
            updatePreview();
        }

        function downloadSingleFile() {
            const html = editorHTML.getValue();
            const css = editorCSS.getValue();
            const js = editorJS.getValue();
            const fileContent = `<!DOCTYPE html>\n<html>\n<head>\n<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n<script>\n${js}\n<\/script>\n</body>\n</html>`;
            
            const blob = new Blob([fileContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (document.getElementById('current-project-title').textContent || 'index') + '.html';
            a.click();
        }

        renderProjectGrid();
    </script>
</body>
</html>
