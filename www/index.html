<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Code</title>
    <!-- CodeMirror Editor Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #e6e9ef;
            --shadow-light: #ffffff;
            --shadow-dark: #b8bec9;
            --accent-blue: #0066ff;
            --text-color: #4a5568;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
        }

        .neu-flat {
            background: var(--bg-color);
            box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
            border-radius: 16px;
        }

        .neu-pressed {
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-radius: 16px;
        }

        .tabs-header {
            display: flex;
            gap: 12px;
            padding: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: var(--accent-blue);
        }

        .icon-square {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .icon-html { background: linear-gradient(135deg, #ff5722, #ff9800); }
        .icon-css { background: linear-gradient(135deg, #0066ff, #00d2ff); }
        .icon-js { background: linear-gradient(135deg, #ffc107, #ff9800); }

        .editor-container {
            height: 200px;
            padding: 10px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .editor-wrapper {
            display: none;
            height: 100%;
        }

        .editor-wrapper.active {
            display: block;
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 13px !important;
            line-height: 1.5 !important;
            background-color: transparent !important;
            color: #2d3748 !important;
        }

        .CodeMirror-gutters {
            background-color: transparent !important;
            border-right: 1px solid rgba(0,0,0,0.05) !important;
        }

        .CodeMirror-linenumber {
            color: #a0aec0 !important;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            border-radius: 30px;
            flex-shrink: 0;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
            transition: opacity 0.15s ease-in-out;
        }

        .status-dot.typing {
            animation: pulse-blink 0.3s infinite alternate;
        }

        @keyframes pulse-blink {
            0% { opacity: 0.2; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .buttons-group {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 7px 12px;
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-action:active {
            box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light);
        }

        #file-input {
            display: none;
        }

        .preview-container {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="tabs-header neu-flat">
            <button class="tab-btn active" onclick="switchTab('html')">
                <span class="icon-square icon-html"></span> HTML
            </button>
            <button class="tab-btn" onclick="switchTab('css')">
                <span class="icon-square icon-css"></span> CSS
            </button>
            <button class="tab-btn" onclick="switchTab('js')">
                <span class="icon-square icon-js"></span> JS
            </button>
        </div>

        <div class="editor-container neu-pressed">
            <div id="wrapper-html" class="editor-wrapper active">
                <textarea id="code-html"></textarea>
            </div>
            <div id="wrapper-css" class="editor-wrapper">
                <textarea id="code-css"></textarea>
            </div>
            <div id="wrapper-js" class="editor-wrapper">
                <textarea id="code-js"></textarea>
            </div>
        </div>

        <div class="action-bar neu-flat">
            <div class="live-status">
                LIVE <span id="live-dot" class="status-dot"></span>
            </div>
            <div class="buttons-group">
                <input type="file" id="file-input" accept=".html,.htm" onchange="importHTMLFile(event)">
                
                <button class="btn-action" onclick="document.getElementById('file-input').click()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Import
                </button>
                <button class="btn-action" onclick="downloadCode()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                </button>
                <button class="btn-action" onclick="resetCode()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Reset
                </button>
            </div>
        </div>

        <div class="preview-container neu-pressed">
            <iframe id="preview-window"></iframe>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script>
        const editorHTML = CodeMirror.fromTextArea(document.getElementById('code-html'), {
            mode: 'htmlmixed',
            lineNumbers: true,
            autoCloseTags: true,
            autoCloseBrackets: true,
            extraKeys: {"Ctrl-Space": "autocomplete"}
        });

        const editorCSS = CodeMirror.fromTextArea(document.getElementById('code-css'), {
            mode: 'css',
            lineNumbers: true,
            autoCloseBrackets: true,
            extraKeys: {"Ctrl-Space": "autocomplete"}
        });

        const editorJS = CodeMirror.fromTextArea(document.getElementById('code-js'), {
            mode: 'javascript',
            lineNumbers: true,
            autoCloseBrackets: true,
            extraKeys: {"Ctrl-Space": "autocomplete"}
        });

        let typingTimer;
        const liveDot = document.getElementById('live-dot');

        [editorHTML, editorCSS, editorJS].forEach(editor => {
            editor.on('inputRead', function (cm, change) {
                if (change.origin !== '+input') return;
                const text = change.text[0];
                if (/[a-zA-Z0-9<]/.test(text)) {
                    CodeMirror.commands.autocomplete(cm, null, { completeSingle: false });
                }
            });

            editor.on('change', () => {
                triggerBlink();
                updatePreview();
            });
        });

        function triggerBlink() {
            liveDot.classList.add('typing');
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                liveDot.classList.remove('typing');
            }, 600);
        }

        function updatePreview() {
            const html = editorHTML.getValue();
            const css = editorCSS.getValue();
            const js = editorJS.getValue();

            const fullContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>${css}</style>
                </head>
                <body>
                    ${html}
                    <script>${js}<\/script>
                </body>
                </html>
            `;

            const doc = document.getElementById('preview-window').contentWindow.document;
            doc.open();
            doc.write(fullContent);
            doc.close();
        }

        function importHTMLFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');

                let extractedCSS = '';
                const styleTags = doc.querySelectorAll('style');
                styleTags.forEach(style => {
                    extractedCSS += style.textContent + '\n';
                    style.remove();
                });

                let extractedJS = '';
                const scriptTags = doc.querySelectorAll('script');
                scriptTags.forEach(script => {
                    if (!script.src) {
                        extractedJS += script.textContent + '\n';
                        script.remove();
                    }
                });

                editorHTML.setValue(doc.body.innerHTML.trim() || content);
                if (extractedCSS.trim()) editorCSS.setValue(extractedCSS.trim());
                if (extractedJS.trim()) editorJS.setValue(extractedJS.trim());

                updatePreview();
                switchTab('html');
                event.target.value = '';
            };

            reader.readAsText(file);
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const wrappers = document.querySelectorAll('.editor-wrapper');
            
            tabs.forEach(t => t.classList.remove('active'));
            wrappers.forEach(w => w.classList.remove('active'));

            if(tab === 'html') {
                tabs[0].classList.add('active');
                document.getElementById('wrapper-html').classList.add('active');
                editorHTML.refresh();
            } else if(tab === 'css') {
                tabs[1].classList.add('active');
                document.getElementById('wrapper-css').classList.add('active');
                editorCSS.refresh();
            } else if(tab === 'js') {
                tabs[2].classList.add('active');
                document.getElementById('wrapper-js').classList.add('active');
                editorJS.refresh();
            }
        }

        function resetCode() {
            editorHTML.setValue('');
            editorCSS.setValue('');
            editorJS.setValue('');
            updatePreview();
        }

        function downloadCode() {
            const html = editorHTML.getValue();
            const css = editorCSS.getValue();
            const js = editorJS.getValue();

            const fileContent = `<!DOCTYPE html>\n<html>\n<head>\n<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n<script>\n${js}\n<\/script>\n</body>\n</html>`;
            
            const blob = new Blob([fileContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }

        updatePreview();
    </script>
</body>
</html>
