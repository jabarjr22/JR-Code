<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JR Code</title>
    <!-- CodeMirror Editor Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --bg-color: #e6e9ef;
            --shadow-light: #ffffff;
            --shadow-dark: #b8bec9;
            --accent-blue: #0066ff;
            --text-color: #4a5568;
            --danger-color: #ff3b30;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .neu-flat {
            background: var(--bg-color);
            box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
            border-radius: 16px;
        }

        .neu-pressed {
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-radius: 16px;
        }

        .neu-btn {
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            transition: all 0.2s ease;
        }

        .neu-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        /* View Switching System */
        .page-view {
            display: none;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            flex-direction: column;
            gap: 14px;
        }

        .page-view.active-page {
            display: flex;
        }

        /* PAGE 1: App Grid Layout */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-svg {
            width: 28px;
            height: 28px;
        }

        .app-grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-auto-rows: max-content;
            gap: 24px 16px;
            align-content: start;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
        }

        .item-icon-box {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            background: var(--bg-color);
            transition: transform 0.2s ease;
        }

        .grid-item:active .item-icon-box {
            transform: scale(0.92);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .item-title {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            color: var(--text-color);
            word-break: break-word;
            max-width: 85px;
            line-height: 1.2;
        }

        /* PAGE 2: FULL PREVIEW */
        .preview-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .full-preview-container {
            flex: 1;
            padding: 4px;
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
        }

        /* PAGE 3: CODE EDITOR */
        .nav-back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            padding: 6px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light);
            color: var(--accent-blue);
        }

        .icon-square {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .icon-html { background: linear-gradient(135deg, #ff5722, #ff9800); }
        .icon-css { background: linear-gradient(135deg, #0066ff, #00d2ff); }
        .icon-js { background: linear-gradient(135deg, #ffc107, #ff9800); }

        .editor-container {
            flex: 1;
            padding: 10px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }

        .editor-wrapper {
            display: none;
            height: 100%;
        }

        .editor-wrapper.active {
            display: block;
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 13px !important;
            line-height: 1.5 !important;
            background-color: transparent !important;
            color: #2d3748 !important;
        }

        .CodeMirror-gutters {
            background-color: transparent !important;
            border-right: 1px solid rgba(0,0,0,0.05) !important;
        }

        /* Modal Dialog Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            width: 85%;
            max-width: 320px;
            padding: 20px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-color);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 4px;
        }

        .neu-input {
            width: 100%;
            padding: 10px 14px;
            border: none;
            outline: none;
            background: var(--bg-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            border-radius: 14px;
            font-size: 13px;
            color: var(--text-color);
            user-select: text;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .context-menu-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--bg-color);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .context-menu-btn:active {
            box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light);
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <!-- SVG LOGO TEMPLATE -->
    <svg style="display:none;">
        <symbol id="jr-logo" viewBox="0 0 100 100">
            <path d="M 32 25 L 12 50 L 32 75" fill="none" stroke="#0055ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 58 20 L 42 80" fill="none" stroke="#00d2ff" stroke-width="11" stroke-linecap="round"/>
            <path d="M 68 25 L 88 50 L 68 75" fill="none" stroke="#ff4500" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

    <!-- PAGE 1: BERANDA / APP GRID -->
    <div id="page-list" class="page-view active-page">
        <div class="header-bar neu-flat">
            <div class="app-title">
                <svg class="logo-svg"><use href="#jr-logo"/></svg>
                JR CODE
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="file" id="file-input" accept="text/html, .html, .htm">
                <button class="neu-btn" onclick="triggerFileInput()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Import
                </button>
                <button class="neu-btn" onclick="openCreateModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Baru
                </button>
            </div>
        </div>

        <div id="grid-container" class="app-grid-container neu-pressed"></div>
    </div>

    <!-- PAGE 2: FULL PREVIEW (Direct Open) -->
    <div id="page-preview" class="page-view">
        <div class="preview-bar neu-flat">
            <button class="neu-btn" onclick="goHomeFromPreview()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                Kembali
            </button>
            <span id="preview-project-title" style="font-size: 14px; font-weight: 800; color: var(--text-color);">Project</span>
            <button class="neu-btn" style="color: var(--accent-blue);" onclick="switchToEditor()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit
            </button>
        </div>
        <div class="full-preview-container neu-pressed">
            <iframe id="full-preview-window"></iframe>
        </div>
    </div>

    <!-- PAGE 3: CODE EDITOR -->
    <div id="page-editor" class="page-view">
        <div class="nav-back-bar neu-flat">
            <button class="neu-btn" onclick="goBackToPreview()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                Selesai
            </button>
            <span id="editor-project-title" style="font-size: 14px; font-weight: 800; color: var(--text-color);">Project</span>
            <button class="neu-btn" onclick="saveCurrentProject()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Simpan
            </button>
        </div>

        <div class="tabs-header neu-flat">
            <button class="tab-btn active" onclick="switchTab('html')">
                <span class="icon-square icon-html"></span> HTML
            </button>
            <button class="tab-btn" onclick="switchTab('css')">
                <span class="icon-square icon-css"></span> CSS
            </button>
            <button class="tab-btn" onclick="switchTab('js')">
                <span class="icon-square icon-js"></span> JS
            </button>
        </div>

        <div class="editor-container neu-pressed">
            <div id="wrapper-html" class="editor-wrapper active">
                <textarea id="code-html"></textarea>
            </div>
            <div id="wrapper-css" class="editor-wrapper">
                <textarea id="code-css"></textarea>
            </div>
            <div id="wrapper-js" class="editor-wrapper">
                <textarea id="code-js"></textarea>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP CONTEXT MENU (Tekan Lama) -->
    <div id="modal-context" class="modal-overlay">
        <div class="modal-card neu-flat">
            <div id="context-title" class="modal-title">Nama File</div>
            <button class="context-menu-btn" onclick="actionFromContext('open')">
                👁️ Buka Preview
            </button>
            <button class="context-menu-btn" onclick="actionFromContext('edit')">
                ✏️ Edit Kode
            </button>
            <button class="context-menu-btn" onclick="actionFromContext('rename')">
                🏷️ Rename (Ubah Nama)
            </button>
            <button class="context-menu-btn" style="color: var(--danger-color);" onclick="actionFromContext('delete')">
                🗑️ Hapus
            </button>
            <div class="modal-buttons">
                <button class="neu-btn" onclick="closeContextModal()">Batal</button>
            </div>
        </div>
    </div>

    <!-- MODAL BUAT BARU -->
    <div id="modal-create" class="modal-overlay">
        <div class="modal-card neu-flat">
            <div class="modal-title">Buat File Baru</div>
            <input type="text" id="new-file-name" class="neu-input" placeholder="Nama berkas...">
            <div class="modal-buttons">
                <button class="neu-btn" onclick="closeCreateModal()">Batal</button>
                <button class="neu-btn" style="color: var(--accent-blue);" onclick="confirmCreateProject()">Buat</button>
            </div>
        </div>
    </div>

    <!-- MODAL RENAME FILE -->
    <div id="modal-rename" class="modal-overlay">
        <div class="modal-card neu-flat">
            <div class="modal-title">Ubah Nama File</div>
            <input type="text" id="rename-input" class="neu-input">
            <div class="modal-buttons">
                <button class="neu-btn" onclick="closeRenameModal()">Batal</button>
                <button class="neu-btn" style="color: var(--accent-blue);" onclick="confirmRenameProject()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- CodeMirror Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <script>
        let projects = JSON.parse(localStorage.getItem('jrcode_projects')) || [
            {
                id: 'demo-1',
                name: 'Welcome App',
                html: '<div class="card"><h1>JR CODE</h1><p>Selamat datang di JR Code Editor.</p><button onclick="alert(\'Aplikasi Berjalan!\')">Tes Klik</button></div>',
                css: 'body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #e0e5ec; margin: 0; }\n.card { background: #e0e5ec; padding: 30px; border-radius: 20px; box-shadow: 8px 8px 16px #b8bec9, -8px -8px 16px #ffffff; text-align: center; }\nbutton { margin-top: 15px; padding: 10px 20px; border: none; border-radius: 12px; background: #0066ff; color: white; font-weight: bold; cursor: pointer; }',
                js: 'console.log("JR Code Active!");'
            }
        ];

        let activeProjectId = null;
        let selectedContextId = null;
        let holdTimer = null;
        let isLongPress = false;

        const editorHTML = CodeMirror.fromTextArea(document.getElementById('code-html'), { mode: 'htmlmixed', lineNumbers: true });
        const editorCSS = CodeMirror.fromTextArea(document.getElementById('code-css'), { mode: 'css', lineNumbers: true });
        const editorJS = CodeMirror.fromTextArea(document.getElementById('code-js'), { mode: 'javascript', lineNumbers: true });

        function renderProjectGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            projects.forEach(proj => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                
                item.innerHTML = `
                    <div class="item-icon-box">
                        <svg class="logo-svg" style="width: 36px; height: 36px;"><use href="#jr-logo"/></svg>
                    </div>
                    <div class="item-title">${proj.name}</div>
                `;

                // Handle Long Press & Short Press
                item.addEventListener('touchstart', (e) => startPress(e, proj.id), {passive: true});
                item.addEventListener('touchend', (e) => endPress(e, proj.id));
                item.addEventListener('mousedown', (e) => startPress(e, proj.id));
                item.addEventListener('mouseup', (e) => endPress(e, proj.id));

                container.appendChild(item);
            });

            localStorage.setItem('jrcode_projects', JSON.stringify(projects));
        }

        function startPress(e, id) {
            isLongPress = false;
            holdTimer = setTimeout(() => {
                isLongPress = true;
                openContextMenu(id);
            }, 500); // 500ms untuk Tekan Lama
        }

        function endPress(e, id) {
            clearTimeout(holdTimer);
            if (!isLongPress && e.type !== 'mouseleave') {
                openFullPreview(id); // Tekan sebentar -> Langsung Buka Full Preview
            }
        }

        function openFullPreview(id) {
            const proj = projects.find(p => p.id === id);
            if (!proj) return;

            activeProjectId = id;
            document.getElementById('preview-project-title').textContent = proj.name;

            const fullContent = `<!DOCTYPE html><html><head><style>${proj.css || ''}</style></head><body>${proj.html || ''}<script>${proj.js || ''}<\/script></body></html>`;
            const doc = document.getElementById('full-preview-window').contentWindow.document;
            doc.open();
            doc.write(fullContent);
            doc.close();

            document.getElementById('page-list').classList.remove('active-page');
            document.getElementById('page-preview').classList.add('active-page');
        }

        function switchToEditor() {
            const proj = projects.find(p => p.id === activeProjectId);
            if (!proj) return;

            document.getElementById('editor-project-title').textContent = proj.name;
            editorHTML.setValue(proj.html || '');
            editorCSS.setValue(proj.css || '');
            editorJS.setValue(proj.js || '');

            document.getElementById('page-preview').classList.remove('active-page');
            document.getElementById('page-editor').classList.add('active-page');
            switchTab('html');
        }

        function goHomeFromPreview() {
            document.getElementById('page-preview').classList.remove('active-page');
            document.getElementById('page-list').classList.add('active-page');
        }

        function goBackToPreview() {
            saveCurrentProject();
            document.getElementById('page-editor').classList.remove('active-page');
            openFullPreview(activeProjectId);
        }

        function saveCurrentProject() {
            if (!activeProjectId) return;
            const proj = projects.find(p => p.id === activeProjectId);
            if (proj) {
                proj.html = editorHTML.getValue();
                proj.css = editorCSS.getValue();
                proj.js = editorJS.getValue();
                localStorage.setItem('jrcode_projects', JSON.stringify(projects));
            }
        }

        /* Pop-up Menu Context Handlers */
        function openContextMenu(id) {
            selectedContextId = id;
            const proj = projects.find(p => p.id === id);
            if (!proj) return;

            document.getElementById('context-title').textContent = proj.name;
            document.getElementById('modal-context').style.display = 'flex';
        }

        function closeContextModal() {
            document.getElementById('modal-context').style.display = 'none';
        }

        function actionFromContext(type) {
            closeContextModal();
            if (type === 'open') {
                openFullPreview(selectedContextId);
            } else if (type === 'edit') {
                activeProjectId = selectedContextId;
                switchToEditor();
            } else if (type === 'rename') {
                openRenameModal();
            } else if (type === 'delete') {
                if (confirm('Hapus berkas ini?')) {
                    projects = projects.filter(p => p.id !== selectedContextId);
                    renderProjectGrid();
                }
            }
        }

        /* Rename Modal */
        function openRenameModal() {
            const proj = projects.find(p => p.id === selectedContextId);
            if (!proj) return;
            document.getElementById('rename-input').value = proj.name;
            document.getElementById('modal-rename').style.display = 'flex';
        }

        function closeRenameModal() {
            document.getElementById('modal-rename').style.display = 'none';
        }

        function confirmRenameProject() {
            const newName = document.getElementById('rename-input').value.trim();
            const proj = projects.find(p => p.id === selectedContextId);
            if (proj && newName !== '') {
                proj.name = newName;
                renderProjectGrid();
            }
            closeRenameModal();
        }

        /* Create Modal */
        function openCreateModal() {
            document.getElementById('new-file-name').value = '';
            document.getElementById('modal-create').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('modal-create').style.display = 'none';
        }

        function confirmCreateProject() {
            const nameInput = document.getElementById('new-file-name').value.trim();
            const newName = nameInput !== '' ? nameInput : 'Proyek Baru';

            const newProj = {
                id: 'proj_' + Date.now(),
                name: newName,
                html: '<h1>' + newName + '</h1>\n<p>Mulai ketik kode di sini...</p>',
                css: 'body { padding: 20px; font-family: sans-serif; }',
                js: ''
            };

            projects.push(newProj);
            closeCreateModal();
            renderProjectGrid();
            openFullPreview(newProj.id);
        }

        /* File Import Handler */
        function triggerFileInput() {
            const fileInput = document.getElementById('file-input');
            fileInput.value = '';
            fileInput.click();
        }

        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');

                let extractedCSS = '';
                doc.querySelectorAll('style').forEach(s => {
                    extractedCSS += s.textContent + '\n';
                    s.remove();
                });

                let extractedJS = '';
                doc.querySelectorAll('script').forEach(s => {
                    if (!s.src) {
                        extractedJS += s.textContent + '\n';
                        s.remove();
                    }
                });

                const importedProj = {
                    id: 'proj_' + Date.now(),
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    html: doc.body.innerHTML.trim() || content,
                    css: extractedCSS.trim(),
                    js: extractedJS.trim()
                };

                projects.push(importedProj);
                renderProjectGrid();
                openFullPreview(importedProj.id);
            };
            reader.readAsText(file);
        });

        /* Tab Switcher */
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const wrappers = document.querySelectorAll('.editor-wrapper');
            
            tabs.forEach(t => t.classList.remove('active'));
            wrappers.forEach(w => w.classList.remove('active'));

            if(tab === 'html') {
                tabs[0].classList.add('active');
                document.getElementById('wrapper-html').classList.add('active');
                editorHTML.refresh();
            } else if(tab === 'css') {
                tabs[1].classList.add('active');
                document.getElementById('wrapper-css').classList.add('active');
                editorCSS.refresh();
            } else if(tab === 'js') {
                tabs[2].classList.add('active');
                document.getElementById('wrapper-js').classList.add('active');
                editorJS.refresh();
            }
        }

        renderProjectGrid();
    </script>
</body>
</html>
